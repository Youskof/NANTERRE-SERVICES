<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Nanterre Services — V6</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111c2e;
      --panel-2: #16243a;
      --panel-3: #1b2c45;
      --line: rgba(157, 180, 212, .13);
      --text: #edf3fc;
      --muted: #91a2bb;
      --blue: #4d91ff;
      --blue-2: #276bd6;
      --green: #38c995;
      --amber: #f2b95f;
      --red: #ed747b;
      --radius: 17px;
      --shadow: 0 18px 50px rgba(0,0,0,.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(circle at 80% -10%, rgba(50,111,201,.18), transparent 35%), var(--bg);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 258px; flex: 0 0 258px; padding: 24px 16px;
      background: rgba(13,22,37,.94); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 26px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 9px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
      background: linear-gradient(145deg, #5aa2ff, #2358b5); font-weight: 900; letter-spacing: -.08em;
      box-shadow: 0 8px 24px rgba(48,117,220,.3);
    }
    .brand strong { display: block; font-size: 14px; letter-spacing: .07em; }
    .brand small { color: var(--muted); font-size: 11px; }
    .nav-label { color: #71839e; font-size: 10px; font-weight: 800; letter-spacing: .13em; padding: 0 11px; margin-bottom: 8px; }
    .nav { display: grid; gap: 5px; }
    .nav button {
      border: 1px solid transparent; color: #aebbd0; background: transparent; text-align: left;
      padding: 11px 12px; border-radius: 11px; display: flex; align-items: center; gap: 12px;
      transition: .18s ease;
    }
    .nav button:hover { background: rgba(255,255,255,.045); color: white; }
    .nav button.active { background: linear-gradient(90deg, rgba(65,135,239,.2), rgba(65,135,239,.07)); border-color: rgba(80,145,255,.22); color: #fff; }
    .nav-icon { width: 23px; text-align: center; font-size: 16px; }
    .side-bottom { margin-top: auto; }
    .demo-note { padding: 13px; border: 1px solid rgba(242,185,95,.2); border-radius: 12px; background: rgba(242,185,95,.06); color: #c9b58e; font-size: 11px; }
    .main { flex: 1; min-width: 0; }
    .topbar {
      height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 34px; border-bottom: 1px solid var(--line); background: rgba(11,18,32,.68); backdrop-filter: blur(14px);
      position: sticky; top: 0; z-index: 5;
    }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb b { color: var(--text); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .status-pill { border: 1px solid rgba(56,201,149,.22); background: rgba(56,201,149,.08); color: #72dfb7; padding: 7px 10px; border-radius: 999px; font-size: 11px; }
    .avatar { width: 35px; height: 35px; border-radius: 50%; display: grid; place-items: center; background: #233b5d; color: #dceaff; font-weight: 800; }
    .mobile-menu { display: none; border: 1px solid var(--line); background: var(--panel); color: white; border-radius: 10px; padding: 8px 11px; }
    .content { max-width: 1450px; padding: 32px 34px 50px; margin: auto; }
    .welcome { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 27px; }
    .eyebrow { color: #73aaff; text-transform: uppercase; font-size: 10px; letter-spacing: .16em; font-weight: 800; }
    h1 { margin: 7px 0 5px; font-size: clamp(25px, 3vw, 34px); letter-spacing: -.04em; line-height: 1.15; }
    .sub { color: var(--muted); margin: 0; }
    .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .card {
      background: linear-gradient(145deg, rgba(22,36,58,.96), rgba(16,27,44,.96));
      border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
      min-width: 0;
    }
    .span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
    .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .card h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
    .muted { color: var(--muted); }
    .tiny { color: var(--muted); font-size: 11px; }
    .hero {
      background: radial-gradient(circle at 85% 20%, rgba(77,145,255,.23), transparent 32%), linear-gradient(120deg, #152b49, #142238 70%);
      border-color: rgba(87,151,255,.2); padding: 25px;
    }
    .hero-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .hero h2 { font-size: 20px; margin: 5px 0 7px; }
    .hero p { margin: 0; color: #aebed5; max-width: 610px; }
    .hero-symbol { width: 76px; height: 76px; flex: 0 0 76px; border-radius: 22px; display: grid; place-items: center; font-size: 32px; background: rgba(80,145,255,.13); border: 1px solid rgba(112,168,255,.18); }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
    .stat { padding: 15px; background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 13px; }
    .stat strong { display: block; font-size: 23px; letter-spacing: -.04em; }
    .stat span { color: var(--muted); font-size: 11px; }
    .service-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .service {
      border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: rgba(255,255,255,.025);
      color: var(--text); text-align: left; transition: .18s; min-height: 130px;
    }
    .service:hover { transform: translateY(-2px); border-color: rgba(77,145,255,.42); background: rgba(77,145,255,.07); }
    .service .ico { font-size: 21px; margin-bottom: 12px; }
    .service strong { display: block; margin-bottom: 4px; }
    .service small { color: var(--muted); }
    .list { display: grid; gap: 0; }
    .list-row { display: flex; justify-content: space-between; gap: 15px; padding: 12px 0; border-top: 1px solid var(--line); }
    .list-row:first-child { border-top: 0; padding-top: 0; }
    .list-row:last-child { padding-bottom: 0; }
    .tag { font-size: 10px; border-radius: 999px; padding: 4px 8px; white-space: nowrap; background: rgba(77,145,255,.1); color: #8dbaff; }
    .tag.green { background: rgba(56,201,149,.1); color: #72dfb7; }
    .tag.amber { background: rgba(242,185,95,.1); color: #f2c77e; }
    .btn {
      border: 1px solid rgba(90,155,255,.28); border-radius: 10px; padding: 9px 13px;
      color: white; background: linear-gradient(135deg, #347fe8, #245dbb); font-weight: 700; font-size: 12px;
    }
    .btn.secondary { background: rgba(255,255,255,.04); border-color: var(--line); color: #d6e1f1; }
    .btn:hover { filter: brightness(1.12); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 9px; }
    .empty { border: 1px dashed rgba(145,162,187,.25); border-radius: 13px; padding: 25px; text-align: center; color: var(--muted); }
    .login-wrap { max-width: 480px; margin: 7vh auto; }
    .login-card { padding: 28px; }
    .field { display: grid; gap: 7px; margin: 15px 0; }
    .field label { font-size: 11px; color: #aebbd0; font-weight: 700; }
    .field input, .field select {
      width: 100%; background: #0c1728; color: white; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--blue); }
    .notice { border-radius: 11px; padding: 12px; font-size: 11px; background: rgba(242,185,95,.07); border: 1px solid rgba(242,185,95,.18); color: #d7c194; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 500px; font-size: 12px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .footer { color: #687b96; font-size: 10px; text-align: center; padding: 25px 10px 0; }
    .toast { position: fixed; bottom: 22px; right: 22px; z-index: 20; background: #1c304d; border: 1px solid rgba(100,160,255,.3); color: white; padding: 13px 17px; border-radius: 12px; box-shadow: var(--shadow); display: none; max-width: 330px; }
    .toast.show { display: block; animation: appear .2s ease; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (max-width: 1000px) {
      .sidebar { width: 225px; flex-basis: 225px; }
      .span-8,.span-7,.span-5 { grid-column: span 12; }
      .span-4 { grid-column: span 6; }
    }
    @media (max-width: 720px) {
      .app { display: block; }
      .sidebar { position: fixed; z-index: 10; inset: 0 auto 0 0; width: 270px; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: inline-block; }
      .topbar { height: 65px; padding: 0 16px; }
      .content { padding: 24px 16px 35px; }
      .welcome { align-items: flex-start; flex-direction: column; }
      .date { display: none; }
      .stats { grid-template-columns: repeat(2,1fr); }
      .service-grid { grid-template-columns: repeat(2,1fr); }
      .span-4,.span-6 { grid-column: span 12; }
      .hero-inner { align-items: flex-start; }
      .hero-symbol { width: 54px; height: 54px; flex-basis: 54px; font-size: 24px; }
    }
    @media (max-width: 390px) { .service-grid { grid-template-columns: 1fr; } .status-pill { display: none; } }
    .module-card {
  background: rgba(255,255,255,.025);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 17px;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: .2s;
  min-height: 115px;
}

.module-card:hover {
  background: rgba(77,145,255,.09);
  border-color: var(--blue);
  transform: translateY(-2px);
}

.module-card strong {
  display: block;
  margin-bottom: 6px;
}

.module-card small {
  color: var(--muted);
}

.module-icon {
  font-size: 21px;
  margin-bottom: 10px;
}

.module-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}

.module-back {
  margin-bottom: 18px;
}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">NS</div>
      <div><strong>NANTERRE SERVICES</strong><small>Portail institutionnel · V6</small></div>
    </div>
    <div>
      <div class="nav-label">NAVIGATION</div>
      <nav class="nav" id="navigation">
        <button class="active" data-page="home"><span class="nav-icon">▦</span>Tableau de bord</button>
        <button data-page="citizen"><span class="nav-icon">⌂</span>Espace citoyen</button>
        <button data-page="police"><span class="nav-icon">▣</span>Police nationale</button>
        <button data-page="bspn"><span class="nav-icon">✚</span>BSPN</button>
        <button data-page="samu"><span class="nav-icon">✚</span>SAMU 92</button>
        <button data-page="igpn"><span class="nav-icon">◈</span>IGPN</button>
      </nav>
    </div>
    <div class="side-bottom">
      <div class="demo-note"><strong>Version de démonstration</strong><br>Les actions et données affichées ici sont locales à cette page. Aucun dossier réel n'est enregistré.</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu" id="menuToggle" aria-label="Ouvrir le menu">☰</button>
        <div class="crumb">Portail / <b id="crumb">Tableau de bord</b></div>
      </div>
      <div class="top-actions">
        <span class="status-pill">● Services disponibles</span>
        <div class="avatar" id="avatar">NS</div>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  const pageInfo = {
    home: ["Tableau de bord", "Vue d'ensemble du portail institutionnel."],
    citizen: ["Espace citoyen", "Informations et services destinés aux habitants."],
    police: ["Police nationale", "Espace de travail et outils de la Police nationale."],
    bspn: ["BSPN", "Brigade des sapeurs-pompiers de Nanterre."],
    samu: ["SAMU 92", "Coordination et suivi des activités médicales."],
    igpn: ["IGPN", "Inspection générale et suivi des contrôles internes."],
    admin: ["Administration centrale", "Paramètres généraux et gestion du portail."]
  };
  const content = document.getElementById("content");
  const adminModules = {
  design: {
    title: "Design et textes",
    description: "Personnalisation générale du portail.",
    icon: "▧"
  },
  penal: {
    title: "Code pénal",
    description: "Gestion des infractions, amendes et sanctions.",
    icon: "§"
  },
  rules: {
    title: "Règlements et zones",
    description: "Gestion des règlements et des zones de la ville.",
    icon: "▤"
  },
  webhooks: {
    title: "Webhooks Discord",
    description: "Configuration des notifications Discord.",
    icon: "↗"
  },
  staff: {
    title: "Gestion des effectifs",
    description: "Matricules, grades, services et disponibilités.",
    icon: "♧"
  },
  passwords: {
    title: "Gestion des accès",
    description: "Création et réinitialisation des accès agents.",
    icon: "🔑"
  },
  medals: {
    title: "Médailles",
    description: "Création et attribution des distinctions.",
    icon: "◈"
  },
  taj: {
    title: "TAJ et statistiques",
    description: "Gestion des fiches et statistiques.",
    icon: "⌕"
  },
  alerts: {
    title: "Alertes et sons",
    description: "Gestion des annonces et alertes des services.",
    icon: "⚑"
  }
};

function moduleButton(id) {
  const item = adminModules[id];

  return `
    <button class="module-card" data-module="${id}">
      <div class="module-icon">${item.icon}</div>
      <strong>${item.title}</strong>
      <small>${item.description}</small>
    </button>
  `;
}

function renderModule(id) {
  const item = adminModules[id];

  if (!item) return;

  document.getElementById("crumb").textContent = item.title;

  content.innerHTML = `
    <div class="welcome">
      <div>
        <div class="eyebrow">ADMINISTRATION CENTRALE</div>
        <h1>${item.title}</h1>
        <p class="sub">${item.description}</p>
      </div>
    </div>

    <button class="btn secondary module-back" id="backAdmin">
      ← Retour à l'administration
    </button>

    <div class="grid">
      <section class="card span-12">
        <div class="card-head">
          <h2>${item.title}</h2>
          <span class="tag amber">Connexion à configurer</span>
        </div>

        <div class="notice">
          Cette rubrique est créée. Ses opérations seront raccordées
          à la base de données et protégées par les permissions
          administrateur.
        </div>

        <div id="moduleContent" style="margin-top:20px">
          <div class="empty">
            Interface de gestion en préparation.
          </div>
        </div>
      </section>
    </div>

    <div class="footer">
      NANTERRE SERVICES · ADMINISTRATION CENTRALE
    </div>
  `;

  document.getElementById("backAdmin").addEventListener("click", () => {
    render("admin");
  });
}
  const nav = document.getElementById("navigation");
  const crumb = document.getElementById("crumb");
  const toastBox = document.getElementById("toast");
  let toastTimer;
let adminUnlocked = false;

const ADMIN_ACCESS_CODE = "Nanterre2026";

function requestAdminAccess() {
  if (adminUnlocked) {
    render("admin");
    return;
  }

  content.innerHTML = `
    ${header("admin")}

    <div class="login-wrap">
      <section class="card login-card">
        <div class="eyebrow">ACCÈS RESTREINT</div>
        <h2 style="font-size:21px;margin:8px 0">
          Administration centrale
        </h2>

        <p class="muted">
          Veuillez saisir le code d'accès administrateur.
        </p>

        <div class="field">
          <label for="adminAccessCode">Code d'accès</label>
          <input
            type="password"
            id="adminAccessCode"
            placeholder="Saisir le code"
            autocomplete="off"
          >
        </div>

        <div id="adminError"></div>

        <div class="toolbar">
          <button class="btn" id="validateAdmin">
            Accéder au panel
          </button>

          <button class="btn secondary" id="cancelAdmin">
            Retour
          </button>
        </div>
      </section>
    </div>
  `;

  document.getElementById("validateAdmin").addEventListener("click", () => {
    const code = document.getElementById("adminAccessCode").value;

    if (code === ADMIN_ACCESS_CODE) {
      adminUnlocked = true;
      toast("Accès administrateur autorisé.");
      render("admin");
    } else {
      document.getElementById("adminError").innerHTML = `
        <div class="notice" style="color:#ed747b">
          Code incorrect. Accès refusé.
        </div>
      `;
    }
  });

  document.getElementById("adminAccessCode").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      document.getElementById("validateAdmin").click();
    }
  });

  document.getElementById("cancelAdmin").addEventListener("click", () => {
    render("home");
  });
}
  function toast(message) {
    toastBox.textContent = message;
    toastBox.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastBox.classList.remove("show"), 3200);
  }
  function header(page, label = "ESPACE INSTITUTIONNEL") {
    return `<div class="welcome"><div><div class="eyebrow">${label}</div><h1>${pageInfo[page][0]}</h1><p class="sub">${pageInfo[page][1]}</p></div><div class="date" id="today"></div></div>`;
  }
  function card(title, body, span = "span-6", extra = "") {
    return `<section class="card ${span}"><div class="card-head"><h2>${title}</h2>${extra}</div>${body}</section>`;
  }
  function serviceButton(icon, title, description, page) {
    return `<button class="service" data-go="${page}"><div class="ico">${icon}</div><strong>${title}</strong><small>${description}</small></button>`;
  }
  function render(page = "home") {

  if (page === "admin" && !adminUnlocked) {
    requestAdminAccess();
    return;
  }

  document.querySelectorAll("#navigation button").forEach(b =>
    b.classList.toggle("active", b.dataset.page === page)
  );

  crumb.textContent = pageInfo[page][0];
  document.getElementById("sidebar").classList.remove("open");

  let html = header(page);

  if (page === "home") {
      html += `<div class="grid">
        <section class="card hero span-12"><div class="hero-inner"><div><div class="eyebrow">PORTAIL DES SERVICES</div><h2>Bienvenue sur Nanterre Services</h2><p>Retrouvez les différents espaces institutionnels depuis une interface unique, claire et centralisée.</p><div class="toolbar" style="margin-top:18px"><button class="btn" data-go="citizen">Accéder aux services</button><button class="btn secondary" data-go="admin">Administration</button></div></div><div class="hero-symbol">⌘</div></div></section>
        ${card("État général", `<div class="stats"><div class="stat"><strong>06</strong><span>Espaces</span></div><div class="stat"><strong>24/7</strong><span>Portail accessible</span></div><div class="stat"><strong>—</strong><span>Agents connectés</span></div><div class="stat"><strong>—</strong><span>Alertes actives</span></div></div>`, "span-12")}
        ${card("Accès aux espaces", `<div class="service-grid">
          ${serviceButton("⌂","Espace citoyen","Informations et démarches","citizen")}
          ${serviceButton("▣","Police nationale","Outils et suivi opérationnel","police")}
          ${serviceButton("✚","BSPN","Formation et annonces","bspn")}
          ${serviceButton("✚","SAMU 92","Espace médical","samu")}
          ${serviceButton("◈","IGPN","Contrôle et inspection","igpn")}
          ${serviceButton("⚙","Administration","Gestion du portail","admin")}
        </div>`, "span-8")}
        ${card("Dernières informations", `<div class="list">
          <div class="list-row"><div><strong>Nouvelle interface V6</strong><div class="tiny">Mise en place du portail modernisé</div></div><span class="tag green">Information</span></div>
          <div class="list-row"><div><strong>Espaces institutionnels</strong><div class="tiny">Accès regroupés depuis le tableau de bord</div></div><span class="tag">Portail</span></div>
          <div class="list-row"><div><strong>Maintenance des données</strong><div class="tiny">Les connexions réelles seront configurées ensuite</div></div><span class="tag amber">À venir</span></div>
        </div>`, "span-4")}
        ${card("À propos du portail", `<p class="muted" style="margin-top:0">Nanterre Services centralise les informations et les outils des différents services de la ville.</p><div class="notice">Cette version est une maquette interactive. Ne saisissez aucune information personnelle, médicale ou confidentielle.</div>`, "span-12")}
      </div>`;
    } else if (page === "citizen") {
      html += `<div class="grid">
        ${card("Services aux habitants", `<div class="service-grid">
          ${serviceButton("▤","Actualités","Informations municipales","citizen")}
          ${serviceButton("⌖","Carte de la ville","Points d'intérêt et zones","citizen")}
          ${serviceButton("◉","État de la ville","Informations de situation","citizen")}
        </div>`, "span-8")}
        ${card("Informations publiques", `<div class="list"><div class="list-row"><span>Accueil du public</span><span class="tag green">Disponible</span></div><div class="list-row"><span>Demandes citoyennes</span><span class="tag amber">À configurer</span></div><div class="list-row"><span>Élections</span><span class="tag">Information</span></div></div>`, "span-4")}
        ${card("Démarches et informations", `<div class="empty">Les actualités, démarches et cartes seront ajoutées dans cette rubrique.</div>`, "span-12")}
      </div>`;
    } else if (page === "police") {
      html += `<div class="grid">
